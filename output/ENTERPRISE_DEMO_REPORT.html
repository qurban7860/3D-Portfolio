
<!doctype html>
<html>
<head>
<style>
@page { size: A4 landscape; margin: 10mm; }

body {
  font-family: system-ui, -apple-system, sans-serif;
  margin: 0;
  background: #0a0f1c;
  color: white;
  padding: 10mm;
}

.hero {
  padding: 20px;
  background: linear-gradient(135deg, #111827, #1e1b4b, #312e81);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  margin-bottom: 20px;
}

.hero h1 {
  margin: 0;
  font-size: 24px;
  letter-spacing: -0.025em;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

.card {
  background: #0f172a;
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  page-break-inside: avoid;
  break-inside: avoid;
}

.img-container {
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #020617;
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
}

.card h2 {
  margin: 14px 14px 4px 14px;
  font-size: 16px;
  font-weight: 600;
}
.card p {
  margin: 0 14px 14px 14px;
  color: #94a3b8;
  font-size: 13px;
}
</style>
</head>

<body>
<div class="hero">
  <h1>Enterprise Portfolio Report</h1>
</div>

<div class="grid">
  
    <section class="card">
      <h2>Landing Page</h2>
      <div class="img-container">
        <img src="../output/screenshots/01-landing.png" />
      </div>
      <p>Hero section and CTA</p>
    </section>
  
    <section class="card">
      <h2>Portfolio Showcase</h2>
      <div class="img-container">
        <img src="../output/screenshots/02-portfolio.png" />
      </div>
      <p>Core product showcase</p>
    </section>
  
    <section class="card">
      <h2>Dashboard</h2>
      <div class="img-container">
        <img src="../output/screenshots/03-dashboard.png" />
      </div>
      <p>System control center</p>
    </section>
  
    <section class="card">
      <h2>Experience</h2>
      <div class="img-container">
        <img src="../output/screenshots/04-experience.png" />
      </div>
      <p>Engineering background</p>
    </section>
  
    <section class="card">
      <h2>Services</h2>
      <div class="img-container">
        <img src="../output/screenshots/05-services.png" />
      </div>
      <p>Offerings overview</p>
    </section>
  
    <section class="card">
      <h2>About</h2>
      <div class="img-container">
        <img src="../output/screenshots/06-about.png" />
      </div>
      <p>Profile summary</p>
    </section>
  
    <section class="card">
      <h2>Contact</h2>
      <div class="img-container">
        <img src="../output/screenshots/07-contact.png" />
      </div>
      <p>Lead capture system</p>
    </section>
  
</div>

</body>
</html>
